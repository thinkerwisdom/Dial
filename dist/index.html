<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050506" />
    <title>DIal</title>
    <link rel="stylesheet" href="styles.css?v=3" />
  </head>
  <body>
    <main class="page-shell">
      <section class="dial" id="dial" aria-label="Selector circular DIal">
        <div class="dial__glow" aria-hidden="true"></div>
        <header class="dial__header">
          <span class="brand">DI<span>al</span></span>
          <span class="level-label" id="levelLabel">Principal</span>
        </header>

        <div class="menu-viewport" id="menuViewport">
          <div class="menu-list" id="menuList" role="menu"></div>
        </div>

        <div class="activity-stage" id="activityStage" hidden>
          <iframe id="activityFrame" title="Actividad DIal" allow="autoplay"></iframe>
        </div>

        <div class="scroll-indicator" aria-hidden="true">
          <span class="scroll-indicator__thumb" id="scrollThumb"></span>
        </div>

        <footer class="dial__footer">
          <span><b>↕</b> Elegir</span>
          <span><b>•</b> Entrar</span>
          <span><b>••</b> Volver</span>
        </footer>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js?v=7" defer></script>
  </body>
</html>
